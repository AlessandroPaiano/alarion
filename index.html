<style>
/* Layout: una colonna da telefono. Colori ALA (bianco, grigi, nero), componenti morbidi stile app: controlli segmentati, liste arrotondate, timer con pulsante tondo */
:root{
  --bg:#f4f4f4; --panel:#ffffff; --fill:#ebebeb; --fill2:#dedede; --ink:#333333; --strong:#222222; --muted:#777777; --line:#e4e4e4;
  --accent:#363636; --accent-ink:#ffffff; --gold:#9c7426; --flame:#e3a43a;
  --seg1:#ffffff; --seg2:#ebebeb; --seg3:#d6d6d6;
  --good:#3b7a49; --bad:#a8402f; --infect:#6a5a80; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --display:"Raleway",Helvetica,Arial,sans-serif;
  --body:"Open Sans",Helvetica,Arial,sans-serif;
  --r:12px; --rs:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141618; --panel:#1e2225; --fill:#2a2f33; --fill2:#353b40; --ink:#e2e2e2; --strong:#f5f5f5; --muted:#9a9fa3; --line:#2e3438;
  --accent:#e9e9e9; --accent-ink:#141618; --gold:#d6b46a; --flame:#f0b44c;
  --seg1:#262b2e; --seg2:#30363a; --seg3:#3c4347;
  --good:#7cc08a; --bad:#e48877; --infect:#b3a2c9; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141618; --panel:#1e2225; --fill:#2a2f33; --fill2:#353b40; --ink:#e2e2e2; --strong:#f5f5f5; --muted:#9a9fa3; --line:#2e3438;
  --accent:#e9e9e9; --accent-ink:#141618; --gold:#d6b46a; --flame:#f0b44c;
  --seg1:#262b2e; --seg2:#30363a; --seg3:#3c4347;
  --good:#7cc08a; --bad:#e48877; --infect:#b3a2c9; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:480px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;color:var(--strong)}
h1{font-size:1.7rem;font-weight:800;line-height:1.15;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800;line-height:1.2}
h3{font-size:1.02rem;font-weight:700;line-height:1.3}
p{margin:0}
.lbl{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem}
.good{color:var(--good)} .bad{color:var(--bad)}
/* pulsanti */
button{font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;border:none;border-radius:var(--rs);background:var(--fill);color:var(--strong);padding:10px 16px;min-height:40px;transition:background .12s,transform .08s}
button:hover:not(:disabled){background:var(--fill2)}
button:active:not(:disabled){transform:scale(.98)}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 86%,var(--bg))}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;width:100%;padding:11px 14px;border-radius:var(--rs);border:1px solid transparent;background:var(--fill);color:var(--strong)}
input:focus{background:var(--panel);border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1;min-width:120px}
.steps{display:flex;gap:4px} .steps i{flex:1;height:4px;border-radius:99px;background:var(--fill2)} .steps i.on{background:var(--accent)}
/* superfici */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px}
.card.hot{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.big{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.2;color:var(--strong)}
.motto{font-style:italic;color:var(--muted)}
.wheelbox{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;max-width:100%}
.wheelbox canvas{width:100%;height:100%;display:block}
.pin{position:absolute;left:50%;top:-4px;transform:translateX(-50%);border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--strong)}
/* scelte */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 48px 14px 16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);font-weight:400;font-size:.92rem;min-height:0}
.opt:hover:not(:disabled){background:var(--panel);border-color:var(--fill2)}
.opt b{font-family:var(--display);font-size:1.02rem;font-weight:800;color:var(--strong)}
.opt::after{content:"";position:absolute;right:16px;top:16px;width:20px;height:20px;border-radius:50%;border:2px solid var(--fill2);box-sizing:border-box}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt[aria-checked="true"]::after{border:6px solid var(--accent)}
/* sezioni abilità */
details.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
details.sec>summary:hover{background:color-mix(in srgb,var(--fill) 45%,transparent)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .sn{font-family:var(--display);font-size:1rem;font-weight:800;color:var(--strong)}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:4px}
details.sec[open]>summary::after{transform:rotate(45deg)}
details.sec>summary>span:last-of-type{margin-left:auto}
details.sec>summary:focus-visible{outline-offset:-2px}
.abl{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ab{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ab:last-child{border-bottom:none}
.ab:hover{background:color-mix(in srgb,var(--fill) 35%,transparent)}
.abt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.abt b{font-weight:700;color:var(--strong)}
.ab.own .abt b::before{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7rem;margin-right:8px;vertical-align:1px}
.ab.lock .abt b{color:var(--muted)}
.ab>button{flex:none;min-width:76px;min-height:34px;padding:6px 12px;font-size:.84rem}
.ab>button[data-rm]{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.golink{font:inherit;font-weight:600;font-size:inherit;background:none;border:none;padding:0;min-height:0;color:var(--strong);text-decoration:underline;text-decoration-color:var(--fill2);text-underline-offset:3px;text-decoration-thickness:2px;cursor:pointer;border-radius:3px}
.golink:hover:not(:disabled){background:none;text-decoration-color:currentColor}
.golink.ok{color:var(--good)}
.ab.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--gold) 22%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.ab.flash{animation:none;outline:2px solid var(--gold)}}
.stick{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.1);padding:8px}
.psleft{font-variant-numeric:tabular-nums;padding:0 8px;display:flex;align-items:baseline;gap:4px;color:var(--muted);font-size:.84rem}
.psleft b{font-size:1.3rem;color:var(--strong)}
.sheet{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:baseline;margin:0}
.sheet dt{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sheet dd{margin:0;min-width:0}
/* intestazione di gioco */
.top{display:flex;gap:12px;align-items:center}
.lantern{width:40px;height:56px;flex:none}
.lantern .fl{fill:var(--flame);transform-origin:20px 34px;animation:flick 2.4s ease-in-out infinite}
.lantern .glow{fill:var(--flame);opacity:.22}
.lantern.dim .fl{opacity:.35;animation-duration:4s} .lantern.dim .glow{opacity:.06}
.lantern .frame{fill:none;stroke:var(--strong);stroke-width:2}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.92,1.06)}60%{transform:scale(1.05,.95)}}
.who{flex:1;min-width:0}
.purse{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.purse div{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.purse b{font-size:1.05rem;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.purse .moon b{color:var(--gold)} .purse .ala b{color:var(--infect)}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width .25s}
.bar.infect>i{background:var(--infect)}
/* controllo segmentato */
.tabs{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:3px}
.tabs button{flex:1;padding:8px 4px;min-height:36px;background:transparent;color:var(--muted);border-radius:8px;font-size:.88rem}
.tabs button:hover:not(:disabled){background:transparent;color:var(--strong)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--strong);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* liste */
.board{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.board>:last-child{border-bottom:none}
.mis{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);align-items:center}
.mis:hover{background:color-mix(in srgb,var(--fill) 35%,transparent)}
.mis .t{font-weight:600;color:var(--strong);min-width:0}
.mis .meta{display:flex;gap:6px;flex-wrap:wrap;grid-column:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:6px;padding:2px 8px;color:var(--muted);background:var(--fill);white-space:nowrap}
.chip.z1,.chip.z2,.chip.z3{background:color-mix(in srgb,currentColor 12%,transparent)}
.chip.z1::before,.chip.z2::before,.chip.z3::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.z1{color:var(--good)} .chip.z2{color:var(--gold)} .chip.z3{color:var(--infect)}
.chip.p{font-variant-numeric:tabular-nums}
.play{grid-row:1/3;grid-column:2;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 86%,var(--bg))}
.play svg{width:16px;height:16px;fill:currentColor}
.play .pl{margin-left:3px}
/* timer della missione in corso */
.timer{display:flex;align-items:center;gap:12px}
.timer .ti{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.clock{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700;color:var(--strong);letter-spacing:-.01em}
.timer .play{background:var(--bad);color:#fff}
.timer .play:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 85%,#000)}
/* caratteristiche e avamposto */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat b{font-size:1.35rem;font-variant-numeric:tabular-nums;color:var(--strong)}
.bld{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);align-items:center}
.bld b{color:var(--strong)}
.bld .d{font-size:.86rem;color:var(--muted);grid-column:1;min-width:0}
.bld button{grid-row:1/3;grid-column:2;font-variant-numeric:tabular-nums;min-width:110px;font-size:.84rem}
.prods{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.prow{display:flex;flex-direction:column;gap:5px}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ph b{color:var(--strong);min-width:0}
.pv{font-weight:700;font-variant-numeric:tabular-nums;color:var(--strong);white-space:nowrap}
.lb{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.lb.me,.lg.me{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.lb.gap{justify-content:center;padding:4px}
.lbt{flex:1;min-width:0;display:flex;flex-direction:column}
.lbt b{color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{width:26px;height:26px;flex:none;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--strong);font-variant-numeric:tabular-nums}
.sc{font-weight:700;font-variant-numeric:tabular-nums;color:var(--infect)}
.lg{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.lgh{display:flex;align-items:center;gap:10px}
.lgh b{flex:1;color:var(--strong)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--strong);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);font-size:.9rem;z-index:5}
@media (prefers-reduced-motion:reduce){.lantern .fl{animation:none}.bar>i{transition:none}button{transition:none}}
</style>
</head>

function startMission(id){
 const m=S.board.find(x=>x.id===id);if(!m||S.active||wounded())return;
 const z=ZONES.find(x=>x.id===m.z),ok=Math.random()*100<chance(m),f=Math.pow(m.dur/3600,.7);
 const scale=f*(m.dur>=28800?mult("long"):1)*(z.id!=="margini"?mult("deep"):1);
 const dbl=ok&&Math.random()<mult("double")-(has("double")?0:1)?2:1;
 const loot={falci:0,gems:[],grezzo:0,xp:0,dbl:dbl>1};
 if(ok){loot.falci=Math.round(rnd(z.lune[0],z.lune[1])*scale*mult("lune")*dbl);
  let gc=z.gem[0]*Math.sqrt(f)*mult("gemme")*(m.type==="recupero"?1.5:1);while(gc>0){if(Math.random()<Math.min(gc,1))loot.gems.push(any(z.gem[1]));gc-=1}
  loot.grezzo=Math.round(rnd(z.gz[0],z.gz[1])*(m.type==="raccolta"?2.2:1)*scale*mult("grezzo")*dbl);
  if(m.type==="esplor")loot.xp+=Math.round(z.xp*.4);
  loot.falci+=sum("perFalci");loot.grezzo+=sum("perGrezzo");if(Math.random()<sum("ricett"))loot.gems.push("smeraldo");
 }
 loot.xp+=Math.round(z.xp*f*(ok||has("failxp")?1:.35)*mult("xp"));
 const d=realDur(m);
 S.active={m,ok,loot,start:Date.now(),end:Date.now()+d*1000,text:any(ok?TYPES[m.type].ok:TYPES[m.type].ko)};
 S.board=S.board.filter(x=>x.id!==id);haptic('medium');save();render()}
function claim(){
 const A=S.active;if(!A||Date.now()<A.end)return;const L=A.loot;
 const gemF=L.gems.reduce((a,g)=>a+GEMS[g].v,0);S.falci+=L.falci+gemF;S.grezzo+=L.grezzo;gainXp(L.xp);S.missions++;
 if(!A.ok){const wz=ZONES.find(z=>z.id===A.m.z);if(Math.random()<sum("noWound")){A.saved=true}else{const w=Math.min(4*3600,Math.max(300,realDur(A.m)*.25))*Math.max(.2,mult("heal")*(1-.15*lvl("infermeria")));S.woundUntil=Date.now()+w*1000}}
 S.report=A;S.active=null;fillBoard();haptic(A.ok?'heavy':'medium');save();render()}
function recall(){if(!S.active)return;S.board.unshift(S.active.m);S.active=null;save();render();toast("Hai richiamato il personaggio. Nessun bottino.")}
function wounded(){return Date.now()<S.woundUntil}
function healCost(){const left=(S.woundUntil-Date.now())/1000;return Math.max(5,Math.round(left/6*mult("healCost")))}
function gainXp(x){S.xp+=x;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;S.ps++;toast(`Livello ${S.level}! Hai 1 Punto Scheda da spendere.`);haptic('heavy');syncScore()}}

/* ================= AVAMPOSTO E ALATHIUM ================= */
/* ---- produzione passiva: si accumula nel tempo fino al limite del magazzino ---- */
const PRODS=()=>OUT.filter(o=>o.prod);
const prodRate=o=>{const L=lvl(o.id);return L?o.rate*L*Math.pow(1.5,L-1):0};
const capHours=()=>8+4*lvl("magazzino");
const PNAME={falci:"Lune",grezzo:"Alathium Grezzo",lacrime:"Lacrime"};
function settleProd(){const now=Date.now();S.prod=S.prod||{last:now,acc:{}};const h=Math.max(0,(now-S.prod.last)/3600000);
 PRODS().forEach(o=>{const r=prodRate(o);if(!r)return;S.prod.acc[o.prod]=Math.min(r*capHours(),(S.prod.acc[o.prod]||0)+r*h)});S.prod.last=now}
function prodFull(){return PRODS().some(o=>prodRate(o)&&(S.prod&&S.prod.acc[o.prod]||0)>=prodRate(o)*capHours()-1e-9)}
function collect(){settleProd();const got=[];PRODS().forEach(o=>{const v=Math.floor(S.prod.acc[o.prod]||0);if(v<=0)return;S[o.prod]+=v;S.prod.acc[o.prod]-=v;got.push(o.prod==="falci"?coins(v):`${v} ${PNAME[o.prod]}`)});
 if(!got.length)return toast("Non c'è ancora niente da raccogliere.");toast("Raccolto: "+got.join(", ")+".");haptic('medium');save();render()}
function prodAmount(o,v){return o.prod==="falci"?coinsShort(v):Math.floor(v)}
function prodCard(){settleProd();const ps=PRODS().filter(o=>prodRate(o));
 if(!ps.length)return`<div class="card"><span class="lbl">Produzione dell'avamposto</span><h3>Le tue strutture lavorano per te</h3><p class="small muted">Costruisci la Bottega, lo Scavo o la Distilleria: produrranno Lune, Alathium Grezzo e Lacrime anche quando il gioco è chiuso.</p></div>`;
 const any=ps.some(o=>(S.prod.acc[o.prod]||0)>=1);
 return`<div class="card${prodFull()?" hot":""}"><div class="timer"><div class="ti"><span class="lbl">Produzione dell'avamposto</span><h3>${prodFull()?"Il magazzino è pieno":"Le tue strutture lavorano per te"}</h3></div>
  <button class="primary" id="col" ${any?"":"disabled"}>Raccogli</button></div>
  <div class="prods">${ps.map(o=>{const v=S.prod.acc[o.prod]||0,cap=prodRate(o)*capHours();return`<div class="prow"><div class="ph"><b>${o.n}</b><span class="pv" id="pv-${o.id}">${prodAmount(o,v)}</span></div>
   <div class="bar"><i id="pb-${o.id}" style="width:${v/cap*100}%"></i></div><span class="small muted">${o.prod==="falci"?coins(prodRate(o)):(Math.round(prodRate(o)*100)/100).toLocaleString("it-IT")+" "+PNAME[o.prod]} all'ora · pieno dopo ${capHours()} ore</span></div>`}).join("")}</div></div>`}
function outCost(o){const L=lvl(o.id);return{f:Math.ceil(o.lune*Math.pow(2.1,L)*mult("cost")),lac:o.lac?Math.ceil(o.lac*(L+1)*mult("cost")):2*L}}
function buy(id){const o=OUT.find(x=>x.id===id),c=outCost(o);if(lvl(id)>=5||S.falci<c.f||S.lacrime<c.lac||(o.req&&lvl(o.req)<1))return;
 settleProd();S.falci-=c.f;S.lacrime-=c.lac;S.out[id]=lvl(id)+1;
 if(id==="palizzata"){const z=ZONES.find(z=>z.req===S.out[id]);if(z){toast(`Si apre una nuova zona: ${z.n}.`);S.board.pop();S.board.push(makeMission(z))}}
 fillBoard();haptic('medium');save();render()}
const canRefine=()=>lvl("laboratorio")>=1||has("refineNoLab");
function refine(){if(!canRefine()||S.grezzo<4)return;const n=Math.floor(S.grezzo/4);S.grezzo-=n*4;
 const lac=n*(1+lvl("laboratorio")+sum("lacrime"));S.lacrime+=lac;S.puro+=n;
 toast(`Raffinati ${n*4} Grezzo: ${lac} Lacrime e ${n} Alathium Puro.`);haptic('medium');save();render()}
function deliver(){if(!S.puro)return;const n=S.puro;S.consegnato+=n;S.puro=0;S.falci+=Math.round(n*50*mult("puroPay"));gainXp(Math.round(n*20*mult("delivXp")));syncScore();
 toast(`Consegnato ${n} Alathium Puro alla Loggia. La Cintura di Norendas si rafforza.`);save();render()}
const dayKey=(t=new Date())=>t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
function dailyState(){const d=S.daily||{last:null,streak:0},y=new Date();y.setDate(y.getDate()-1);
 const ready=d.last!==dayKey(),streak=ready?(d.last===dayKey(y)?d.streak+1:1):d.streak;return{ready,streak:Math.min(streak,7)}}
function dailyReward(){const ri=RANKS.findIndex(r=>r[1]===rank().r),st=dailyState().streak,m=(1+.5*ri)*(1+.1*(st-1));
 return{falci:Math.round((150+40*S.level)*m),lacrime:1+ri,grezzo:2+Math.floor(S.level/2)}}
function toMidnight(){const t=new Date();t.setHours(24,0,0,0);return(t-Date.now())/1000}
function claimDaily(){const ds=dailyState();if(!ds.ready)return;const r=dailyReward();S.falci+=r.falci;S.lacrime+=r.lacrime;S.grezzo+=r.grezzo;
 S.daily={last:dayKey(),streak:ds.streak};toast(`Compenso ritirato: ${coins(r.falci)}, ${r.lacrime} Lacrime e ${r.grezzo} Grezzo.`);haptic('heavy');save();render()}
function rank(){let r=RANKS[0][1],next=null;for(const[t,n]of RANKS){if(S.consegnato>=t)r=n;else{next=[t,n];break}}return{r,next}}
function spend(k){if(S.ps<1)return;S.ps--;S.spent[k]++;haptic();save();render()}

  <div class="abl">${list.map(a=>{const o=owned(a.id),free=a.id===freeAb(),ok=preOk(a),pt=preText(a);let btn;

 app.innerHTML=`<div class="top">
  <svg class="lantern${wounded()?' dim':''}" id="lan" viewBox="0 0 40 56" aria-hidden="true"><circle class="glow" cx="20" cy="33" r="19"/><path class="frame" d="M14 6h12M20 2v4M11 12h18l-2 6v24l3 4H10l3-4V18z"/><path class="fl" d="M20 24c4 5 4 9 0 13-4-4-4-8 0-13z"/></svg>
  <div class="who"><div class="lbl">${r.n} · ${l.n}</div><h2>${esc(S.name)}</h2></div></div>
 <div class="purse"><div class="moon"><span class="lbl">Borsa</span><b id="pf"></b></div><div class="ala"><span class="lbl">Alathium Grezzo</span><b id="pg"></b></div><div><span class="lbl">Lacrime</span><b id="pl"></b></div></div>
 <div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="justify-content:space-between"><span class="lbl" id="lv"></span><span class="lbl" id="xpt"></span></div><div class="bar"><i id="xpb"></i></div></div>
 <div class="tabs" role="tablist">${[["missioni","Missioni"],["avamposto","Avamposto"+(dailyState().ready||prodFull()?" •":"")],["scheda","Scheda"+(S.ps>=AB_COST?" •":"")],["classifica","Classifica"]].map(([k,n])=>`<button role="tab" data-t="${k}" aria-selected="${S.tab===k}">${n}</button>`).join("")}</div>
 <div id="tab"></div>`;
 app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();renderGame()});
 (({missioni:tabMissioni,avamposto:tabAvamposto,scheda:tabScheda,classifica:tabClassifica})[S.tab]||tabMissioni)();tick()}

function tabMissioni(){const box=document.getElementById("tab");let h="";
 if(S.report){const A=S.report,L=A.loot;
  h+=`<div class="card hot"><span class="lbl">Rapporto di missione</span><h3>${esc(A.m.title)}</h3><p class="${A.ok?'good':'bad'}"><b>${A.ok?'Riuscita':'Fallita'}.</b> ${A.text}</p>
  <ul class="small" style="margin:0;padding-left:18px">${L.falci?`<li>${coins(L.falci)}</li>`:""}${L.gems.map(g=>`<li>${GEMS[g].n} (vale ${coins(GEMS[g].v)})</li>`).join("")}${L.grezzo?`<li>${L.grezzo} Alathium Grezzo</li>`:""}<li>${L.xp} esperienza</li>${L.dbl?`<li>Occasione colta: bottino doppio</li>`:""}${!A.ok?(A.saved?`<li>Le tue arti mediche ti evitano la ferita</li>`:`<li>Sei ferito e devi riposare</li>`):""}</ul>
  <button id="okr">Chiudi il rapporto</button></div>`}
 if(S.active){h+=`<div class="card hot"><div class="timer"><div class="ti"><span class="lbl">In missione · ${ZONES.find(z=>z.id===S.active.m.z).n}</span><h3>${esc(S.active.m.title)}</h3></div>
  <span class="clock" id="mt"></span><button class="play" id="rc" aria-label="Richiama il personaggio"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="2"/></svg></button></div>
  <div class="bar infect"><i id="mb"></i></div><button class="primary" id="cl" hidden>Leggi il rapporto</button></div>`}
 else if(wounded()){h+=`<div class="card"><span class="lbl">Ferito</span><p>Il tuo corpo di Eletto guarisce in fretta, ma non subito. Pronto tra <b id="wt"></b>.</p><button id="hl"></button></div>`}
 const open=zonesOpen(),next=ZONES.find(z=>!open.includes(z));
 h+=`<div><span class="lbl">Bacheca della Loggia</span></div><div class="board">${S.board.map(m=>{const z=ZONES.find(x=>x.id===m.z),T=TYPES[m.type];
  return`<div class="mis"><div class="t">${esc(m.title)}</div><div class="meta"><span class="chip ${z.c}">${z.n}</span><span class="chip">${T.n} · ${STATS[T.st]}</span><span class="chip p">${dur(realDur(m))}</span><span class="chip p">${chance(m)}%</span></div>
  <button class="play" data-m="${m.id}" aria-label="Parti: ${esc(m.title)}" ${S.active||wounded()?'disabled':''}><svg class="pl" viewBox="0 0 16 16"><path d="M4 2.5v11a1 1 0 0 0 1.5.86l9-5.5a1 1 0 0 0 0-1.72l-9-5.5A1 1 0 0 0 4 2.5z"/></svg></button></div>`}).join("")}</div>
  ${next?`<p class="small muted">${next.n}: serve la Palizzata al livello ${next.req}.</p>`:""}
  <button id="nb" ${S.falci<10||S.active?'disabled':''}>Chiedi nuovi incarichi (10 Falci)</button>`;
 box.innerHTML=h;
 box.querySelectorAll("button[data-m]").forEach(b=>b.onclick=()=>startMission(b.dataset.m));
 const $=id=>document.getElementById(id);
 if($("okr"))$("okr").onclick=()=>{S.report=null;save();render()};
 if($("rc"))$("rc").onclick=recall; if($("cl"))$("cl").onclick=claim;
 if($("hl"))$("hl").onclick=()=>{const c=healCost();if(S.falci<c)return;S.falci-=c;S.woundUntil=0;save();render()};
 $("nb").onclick=()=>{if(S.falci<10)return;S.falci-=10;S.board=[];fillBoard();save();render()}}

function dailyCard(){const ds=dailyState(),r=dailyReward();
 return`<div class="card${ds.ready?" hot":""}"><div class="timer"><div class="ti"><span class="lbl">Una volta al giorno</span><h3>Compenso del Patto della Corona</h3></div>
  ${ds.ready?"":`<span class="clock" id="dc" style="font-size:1.1rem">${clock(toMidnight())}</span>`}</div>
  <p class="small muted">Il Patto paga la tua Loggia per il servizio alla Cintura di Norendas. Il compenso cresce con il grado e il livello, e ogni giorno di fila aggiunge il 10% (fino al 7° giorno).</p>
  <div class="row" style="align-items:center"><span class="chip p">${coinsShort(r.falci)}</span><span class="chip p">${r.lacrime} Lacrime</span><span class="chip p">${r.grezzo} Grezzo</span><span class="chip p">Serie: ${ds.streak} ${ds.streak===1?"giorno":"giorni"}</span></div>
  ${ds.ready?`<button class="primary" id="dly">Ritira il compenso</button>`:`<p class="small muted">Già ritirato oggi. Il prossimo arriva a mezzanotte.</p>`}</div>`}
function tabAvamposto(){const box=document.getElementById("tab"),rk=rank();
 box.innerHTML=`<div class="card"><span class="lbl">Laboratorio · Alathium</span>
  <p class="small muted">4 Alathium Grezzo diventano Lacrime (per costruire) e 1 Alathium Puro, che va consegnato alla Loggia.</p>
  <div class="row"><button id="rf" ${!canRefine()||S.grezzo<4?'disabled':''}>${!canRefine()?'Costruisci il laboratorio':'Raffina'}</button>
  <button class="primary" id="dl" ${!S.puro?'disabled':''}>Consegna ${S.puro} Puro</button></div></div>
 <div class="card"><span class="lbl">${pick("loggia").n} · il tuo grado</span><span class="big">${rk.r}</span>
  <p class="small">Alathium Puro consegnato: <b>${S.consegnato}</b>${rk.next?` · prossimo grado (${rk.next[1]}) a ${rk.next[0]}`:""}</p>
  ${rk.next?`<div class="bar infect"><i style="width:${Math.min(100,S.consegnato/rk.next[0]*100)}%"></i></div>`:""}</div>
 ${dailyCard()}
 ${prodCard()}
 <div><span class="lbl">Il tuo avamposto</span></div>
 <div class="board">${OUT.map(o=>{const L=lvl(o.id),c=outCost(o),max=L>=5;
  return`<div class="bld"><div><b>${o.n}</b> <span class="muted small">liv. ${L}/5</span></div><div class="d">${o.d}</div>
  <button data-o="${o.id}" ${max||S.falci<c.f||S.lacrime<c.lac||(o.req&&lvl(o.req)<1)?'disabled':''}>${max?'Completo':o.req&&lvl(o.req)<1?'Serve il Laboratorio':coinsShort(c.f)+(c.lac?` + ${c.lac} Lacr.`:"")}</button></div>`}).join("")}</div>`;
 if(document.getElementById("col"))document.getElementById("col").onclick=collect;
 document.getElementById("rf").onclick=refine;document.getElementById("dl").onclick=deliver;if(document.getElementById("dly"))document.getElementById("dly").onclick=claimDaily;
 box.querySelectorAll("button[data-o]").forEach(b=>b.onclick=()=>buy(b.dataset.o))}

function tabScheda(){const box=document.getElementById("tab"),[r,f,l]=[pick("regno"),pick("form"),pick("loggia")];
 box.innerHTML=`<div class="stats">${Object.keys(STATS).map(k=>`<div class="stat"><span class="lbl">${STATS[k]}</span><b>${stat(k)}</b></div>`).join("")}</div>
 <p class="small muted">Vigore per le cacce, Ingegno per le rovine, Tempra per l'Alathium, Fortuna per i recuperi. La Fortuna aiuta un po' ovunque.</p>
 <dl class="sheet"><dt>Regno</dt><dd><b>${r.n}</b> <span class="muted small">· ${r.d}</span></dd>
 <dt>Formazione</dt><dd><b>${f.n}</b> <span class="muted small">· ${f.a}. ${f.d}</span></dd>
 <dt>Loggia</dt><dd><b>${l.n}</b> <span class="muted small">· ${l.d}</span></dd>
 <dt>Missioni</dt><dd>${S.missions}</dd></dl>
 <div class="row" style="justify-content:space-between;align-items:baseline"><span class="lbl">Abilità</span><span class="${S.ps>=AB_COST?'good':'muted'} small"><b>${S.ps}</b> Punti Scheda</span></div>
 <p class="small muted">Ogni livello ti dà 1 Punto Scheda, come ogni giornata di gioco nel GRV. Con ${AB_COST} PS apprendi una nuova abilità.</p>
 <div id="abl">${abilList("game")}</div>
 <div id="rs"><button id="rs1">Crea un nuovo Eletto</button></div>`;
 bindAbil(box,"game",renderGame);
 document.getElementById("rs1").onclick=()=>{document.getElementById("rs").innerHTML=`<p>La lanterna di ${esc(S.name)} si spegnerà e perderai tutto. Sicuro?</p><div class="row"><button id="no">Annulla</button><button class="primary" id="yes">Sì, ricomincia</button></div>`;
  document.getElementById("no").onclick=renderGame;document.getElementById("yes").onclick=()=>{S=fresh();save();render()}}}

const SAMPLE={logge:[{loggia:"ankaa",tot:412,n:38},{loggia:"antares",tot:388,n:31},{loggia:"hamal",tot:297,n:27},{loggia:"ensis",tot:254,n:22}],
 top:[["Ingrid di Acquaneve","hamal",61,14],["Oreste Malacarne","ankaa",54,13],["Mika la Rossa","antares",47,12],["Brann Lungopasso","ensis",39,11],["Selene Varo","ankaa",33,10]].map(([name,loggia,consegnato,level])=>({name,loggia,consegnato,level}))};
function tabClassifica(){const box=document.getElementById("tab");
 if(!online()){drawBoard(box,SAMPLE,true);return}
 box.innerHTML=`<div class="card"><p class="muted">Carico la classifica…</p></div>`;
 api("/api/classifica").then(r=>{if(S.tab!=="classifica")return;if(r.status!==200)throw new Error(r.error||"");drawBoard(box,r,false)})
  .catch(e=>{if(S.tab!=="classifica")return;box.innerHTML=`<div class="card"><h3>Classifica non disponibile</h3><p class="small muted">${esc(e.message||"Il server non risponde. Controlla la connessione e riprova.")}</p><button id="rl">Riprova</button></div>`;document.getElementById("rl").onclick=tabClassifica})}
function drawBoard(box,d,sample){const LN=id=>(WORLD.loggia.items.find(l=>l.id===id)||{n:id}).n,mine=S.picks.loggia;
 const lg=WORLD.loggia.items.map(l=>d.logge.find(x=>x.loggia===l.id)||{loggia:l.id,tot:0,n:0}).sort((a,b)=>b.tot-a.tot),max=Math.max(1,...lg.map(x=>x.tot));
 const meIn=d.top.some(p=>p.me),row=(p,i)=>`<div class="lb${p.me?" me":""}"><span class="pos">${i}</span><div class="lbt"><b>${esc(p.name)}</b><span class="small muted">${LN(p.loggia)} · liv. ${p.level}</span></div><span class="sc">${p.consegnato}</span></div>`;
 box.innerHTML=`${sample?`<div class="card"><p class="small"><b>Dati di esempio.</b> La classifica vera compare quando il gioco gira dentro Telegram ed è collegato al server.</p></div>`:""}
 <div class="row" style="justify-content:space-between;align-items:baseline"><span class="lbl">Logge · Alathium Puro consegnato</span>${sample?"":`<button class="golink" id="rl">Aggiorna</button>`}</div>
 <div class="board">${lg.map((x,i)=>`<div class="lg${x.loggia===mine?" me":""}"><div class="lgh"><span class="pos">${i+1}</span><b>${LN(x.loggia)}</b><span class="sc">${x.tot}</span></div>
  <div class="bar infect"><i style="width:${x.tot/max*100}%"></i></div><span class="small muted">${x.n} ${x.n===1?"Eletto":"Eletti"}${x.loggia===mine?" · la tua Loggia":""}</span></div>`).join("")}</div>
 <span class="lbl">Eletti · i primi 20</span>
 <div class="board">${d.top.length?d.top.map((p,i)=>row(p,i+1)).join(""):`<div class="lb"><span class="muted small">Nessun Eletto ha ancora consegnato Alathium Puro.</span></div>`}
  ${!sample&&d.me&&!meIn?`<div class="lb gap"><span class="muted small">…</span></div>${row(Object.assign({me:true},d.me),d.me.pos)}`:""}</div>`;
 if(document.getElementById("rl"))document.getElementById("rl").onclick=tabClassifica}
function tick(){const $=id=>document.getElementById(id);if(!S.created||!$("pf"))return;const now=Date.now();
 $("pf").textContent=coinsShort(S.falci);$("pg").textContent=S.grezzo;$("pl").textContent=S.lacrime;
 $("lv").textContent=`Livello ${S.level}`;$("xpt").textContent=`${S.xp} / ${xpNeed(S.level)} esp`;$("xpb").style.width=(S.xp/xpNeed(S.level)*100)+"%";
 $("lan").classList.toggle("dim",wounded());
 if(S.active&&$("mb")){const p=Math.min(1,(now-S.active.start)/(S.active.end-S.active.start));$("mb").style.width=(p*100)+"%";
  const left=(S.active.end-now)/1000;$("mt").textContent=left>0?clock(left):"Tornato";$("cl").hidden=left>0;$("rc").hidden=left<=0}
 if($("col")){settleProd();let any=false;PRODS().forEach(o=>{const r=prodRate(o);if(!r||!$("pv-"+o.id))return;const v=S.prod.acc[o.prod]||0;if(v>=1)any=true;$("pv-"+o.id).textContent=prodAmount(o,v);$("pb-"+o.id).style.width=(v/(r*capHours())*100)+"%"});$("col").disabled=!any}
 if($("dc")){if(dailyState().ready){render();return}$("dc").textContent=clock(toMidnight())}
 if($("wt")){if(!wounded()){render();return}$("wt").textContent=dur((S.woundUntil-now)/1000);const c=healCost();$("hl").textContent=`Cura subito (${coins(c)})`;$("hl").disabled=S.falci<c}}
let tt;function toast(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3200)}

function render(){if(S.created){fillBoard();renderGame()}else renderCreate()}
render();setInterval(tick,500);syncScore();
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
})();
</script>
